server {
    listen __PORT__;
    server_name _;

    client_max_body_size 2m;
    root /usr/share/nginx/html;
    index index.html;

    # --- Auth (Go) ---------------------------------------------------------
    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Subrequest internal untuk auth_request
    location = /_validate {
        internal;
        proxy_pass http://127.0.0.1:8080/auth/validate;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- Rute publik NestJS: status server dan dokumentasi Scalar ----------
    location ~ ^/api/(health|reference|openapi\.json|openapi)(/|$) {
        proxy_set_header X-User-Id "";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5000; # <--- Diubah dari 3000 ke 5000
        include /etc/nginx/nest_proxy.conf;
    }

    # --- Rute terlindungi NestJS (/api/*) ----------------------------------
    location /api/ {
        error_page 418 = @nest_preflight;
        if ($request_method = OPTIONS) { return 418; }

        auth_request /_validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        error_page 401 = @unauthorized;

        proxy_set_header X-User-Id $auth_user_id;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5000; # <--- Diubah dari 3000 ke 5000
        include /etc/nginx/nest_proxy.conf;
    }

    location @nest_preflight {
        proxy_set_header X-User-Id "";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5000; # <--- Diubah dari 3000 ke 5000
        include /etc/nginx/nest_proxy.conf;
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"success":false,"message":"Unauthorized"}';
    }

    # --- Frontend Analog SPA -----------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
