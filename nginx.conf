server {
    listen __PORT__;
    server_name _;

    client_max_body_size 2m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    root /usr/share/nginx/html;
    index index.html;

    # --- Auth (Go) ---
    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # --- /api/auth/* -> Go (publik) ---
    location ^~ /api/auth/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /health {
        proxy_set_header X-User-Id "";
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/nest_proxy.conf;
    }

    location = /_validate {
        internal;
        proxy_pass http://127.0.0.1:8080/auth/validate;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ===== AVATARS PUBLIK (tanpa auth_request) =====
    location ^~ /api/avatars/ {
        proxy_set_header X-User-Id "";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/nest_proxy.conf;
    }

    # ===== FASE 8 - RUTE PUBLIK .NET (tanpa auth) =====
    location ^~ /api/accounting/health {
        proxy_set_header X-User-Id "";
        rewrite ^/api/accounting/health$ /health break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }
    location ^~ /api/accounting/reference {
        proxy_set_header X-User-Id "";
        rewrite ^/api/accounting/reference$ /reference break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }
    location ^~ /api/accounting/openapi.json {
        proxy_set_header X-User-Id "";
        rewrite ^/api/accounting/openapi.json$ /openapi/v1.json break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    # ===== FASE 8 - RUTE PRIVATE .NET (pakai auth) =====
    location ^~ /api/reports/ {
        error_page 418 = @dotnet_preflight;
        if ($request_method = OPTIONS) { return 418; }
        auth_request /_validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        error_page 401 = @unauthorized;
        proxy_set_header X-User-Id $auth_user_id;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    location ^~ /api/periods {
        error_page 418 = @dotnet_preflight;
        if ($request_method = OPTIONS) { return 418; }
        auth_request /_validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        error_page 401 = @unauthorized;
        proxy_set_header X-User-Id $auth_user_id;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    location ^~ /api/chart-of-accounts {
        error_page 418 = @dotnet_preflight;
        if ($request_method = OPTIONS) { return 418; }
        auth_request /_validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        error_page 401 = @unauthorized;
        proxy_set_header X-User-Id $auth_user_id;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    location ^~ /api/summary {
        error_page 418 = @dotnet_preflight;
        if ($request_method = OPTIONS) { return 418; }
        auth_request /_validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        error_page 401 = @unauthorized;
        proxy_set_header X-User-Id $auth_user_id;
        rewrite ^/api/summary$ /reports/summary break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    # ===== SETTINGS -> Go (wajib auth) =====
    location ^~ /api/settings/ {
        error_page 418 = @go_preflight;
        if ($request_method = OPTIONS) { return 418; }

        auth_request /_validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        error_page 401 = @unauthorized;

        proxy_set_header X-User-Id $auth_user_id;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/nest_proxy.conf;
    }

    # ===== TOOLS - impor Excel =====
    location ^~ /api/tools/ {
        client_max_body_size 10m;

        error_page 418 = @nest_preflight;
        if ($request_method = OPTIONS) { return 418; }

        auth_request /_validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        error_page 401 = @unauthorized;

        proxy_set_header X-User-Id $auth_user_id;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/nest_proxy.conf;
    }

    # --- Rute publik NestJS ---
    location ~ ^/api/(health|reference|openapi\.json|openapi)(/|$) {
        proxy_set_header X-User-Id "";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/nest_proxy.conf;
    }

    # --- Rute terlindungi NestJS ---
    location /api/ {
        error_page 418 = @nest_preflight;
        if ($request_method = OPTIONS) { return 418; }

        auth_request /_validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        error_page 401 = @unauthorized;

        proxy_set_header X-User-Id $auth_user_id;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/nest_proxy.conf;
    }

    location @nest_preflight {
        proxy_set_header X-User-Id "";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/nest_proxy.conf;
    }

    location @dotnet_preflight {
        proxy_set_header X-User-Id "";
        rewrite ^/api/summary$ /reports/summary break;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    location @go_preflight {
        proxy_set_header X-User-Id "";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/nest_proxy.conf;
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"success":false,"message":"Unauthorized"}';
    }

    # ===== FRONTEND NEXT.JS (Static Export) =====
    # Caching asset statis Next.js (_next/static)
    location /_next/static/ {
        alias /usr/share/nginx/html/_next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Custom 404 page dari output Next.js export
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fallback routing SSG + SPA
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}