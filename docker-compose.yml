# Menjalankan image yang sama dengan Render (Dockerfile di root):
# Nginx -> Go auth (8080) + NestJS (5000) + Web SPA (Nginx static)
#
#   docker compose up --build
#   Web:     http://localhost:10000/
#   Scalar:  http://localhost:10000/api/reference
#   API:     http://localhost:10000/api/
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10000:10000"
    environment:
      PORT: "10000"
      # Minimal 32 karakter. Ganti sebelum dipakai di luar mesin lokal.
      JWT_SECRET: ${JWT_SECRET:-ganti-dengan-rahasia-acak-minimal-32-karakter}
      DATABASE_URL: ${DATABASE_URL:?isi DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:10000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:10000/api/auth/google-callback}
      # HTTP biasa di lokal: cookie Secure tidak dikirim, matikan.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
