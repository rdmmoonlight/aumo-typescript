[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dotnet-accounting]
command=/app/dotnet/Accounting.Api
directory=/app/dotnet
environment=ASPNETCORE_URLS="http://127.0.0.1:5100",DOTNET_SYSTEM_GLOBALIZATION_INVARIANT="true",DATABASE_URL="%(ENV_DATABASE_URL)s"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:go-auth]
command=/app/go-auth-app
environment=AUTH_PORT="8080"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nest-api]
command=node /app/nest/dist/main.js
directory=/app/nest
environment=PORT="5000"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
------------------------------------
