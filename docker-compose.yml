version: '3.8'

services:
  # ==========================================
  # API GATEWAY (Nginx)
  # ==========================================
  gateway:
    image: nginx:alpine
    container_name: backend-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - nest-service
      # - dotnet-service
      # - rust-service
    networks:
      - backend-network

  # ==========================================
  # SERVICE 1: Go Auth
  # ==========================================
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: go-auth-service
    environment:
      - PORT=8080
      - ENV=production
    networks:
      - backend-network

  # ==========================================
  # SERVICE 2: NestJS
  # ==========================================
  nest-service:
    build:
      context: ./services/nest-api
      dockerfile: Dockerfile
    container_name: nest-api-service
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - backend-network
  # ==========================================
  # SERVICE 3: ASP.NET Core (Daftarkan saat siap)
  # ==========================================
  # dotnet-service:
  #   build:
  #     context: ./services/dotnet-service
  #     dockerfile: Dockerfile
  #   container_name: dotnet-api-service
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Production
  #     - ASPNETCORE_URLS=http://+:5000
  #   networks:
  #     - backend-network

  # ==========================================
  # SERVICE 4: Rust (Daftarkan saat siap)
  # ==========================================
  # rust-service:
  #   build:
  #     context: ./services/rust-service
  #     dockerfile: Dockerfile
  #   container_name: rust-api-service
  #   networks:
  #     - backend-network

networks:
  backend-network:
    driver: bridge
