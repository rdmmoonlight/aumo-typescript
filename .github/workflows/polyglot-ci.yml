name: Polyglot CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-all:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
          POSTGRES_DB: authtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth -d authtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # 1. Setup & Validate Node.js / TypeScript
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install JS Dependencies
        run: pnpm install --frozen-lockfile
      - name: Test TS Contracts
        run: pnpm run test

      # 2. Setup & Validate Rust
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo Check & Test
        run: |
          cargo check --workspace
          cargo test --workspace

      # 3. Setup & Validate .NET (Roslyn Strict)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore & Build .NET
        run: |
          dotnet restore dotnet/App.sln
          dotnet build dotnet/App.sln --no-restore -c Release /p:TreatWarningsAsErrors=true

      # 4. Setup & Validate Android Kotlin
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Validate Kotlin Codebase
        run: |
          cd android
          gradle testDebugUnitTest --no-daemon

      # 5. Setup & Validate Go Auth Service
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/auth/go.sum

      - name: Build & Test Go Auth Service
        env:
          TEST_DATABASE_URL: postgres://auth:auth@localhost:5432/authtest?sslmode=disable
        run: |
          cd services/auth
          go mod tidy
          go test -v ./...
          go build -o /dev/null ./cmd/server
          
