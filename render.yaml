services:
  - type: web
    name: aumo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - Dockerfile
        - nginx.conf
        - nest_proxy.conf
        - supervisord.conf
        - entrypoint.sh
        - apps/nest/**
        - services/auth/**
        - libs/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Contoh: https://aumo-api.onrender.com/auth/google-callback
      - key: GOOGLE_REDIRECT_URL
        sync: false
