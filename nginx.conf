# Gerbang tunggal di dalam container. __PORT__ diganti saat start (entrypoint.sh)
# dengan variabel PORT dari Render.
#
#   /auth/*                       -> Go auth   (127.0.0.1:8080)
#   /, /health, /reference, ...   -> NestJS    (127.0.0.1:5000), publik
#   selain itu                    -> NestJS, hanya bila token sah (auth_request)
#
# Header X-User-Id selalu ditimpa oleh nilai dari Go (atau dikosongkan),
# sehingga klien tidak dapat memalsukan identitas.

server {
    listen __PORT__;
    server_name _;

    client_max_body_size 2m;

    # --- Auth (Go) ---------------------------------------------------------
    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Subrequest internal untuk auth_request
    location = /_validate {
        internal;
        proxy_pass http://127.0.0.1:8080/auth/validate;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- Rute publik NestJS: status server dan dokumentasi Scalar ----------
    location = / {
        proxy_set_header X-User-Id "";
        include /etc/nginx/nest_proxy.conf;
    }

    location ~ ^/(health|reference|openapi\.json|openapi)(/|$) {
        proxy_set_header X-User-Id "";
        include /etc/nginx/nest_proxy.conf;
    }

    # --- Rute terlindungi NestJS -------------------------------------------
    location / {
        # Preflight CORS tidak membawa kredensial: lewati auth_request
        error_page 418 = @nest_preflight;
        if ($request_method = OPTIONS) { return 418; }

        auth_request /_validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        error_page 401 = @unauthorized;

        proxy_set_header X-User-Id $auth_user_id;
        include /etc/nginx/nest_proxy.conf;
    }

    location @nest_preflight {
        proxy_set_header X-User-Id "";
        include /etc/nginx/nest_proxy.conf;
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"success":false,"message":"Unauthorized"}';
    }
}
