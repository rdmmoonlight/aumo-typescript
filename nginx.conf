server {
    listen __PORT__;
    server_name _;

    client_max_body_size 2m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    root /usr/share/nginx/html;
    index index.html;

    # ===== VALIDASI AUTH INTERNAL =====
    location = /_validate {
        internal;
        proxy_pass http://127.0.0.1:5100/auth/validate;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ===== 1. DOKUMENTASI SCALAR & OPENAPI PUBLIK (TANPA AUTH) =====
    location = /reference {
        proxy_set_header X-User-Id "";
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    location = /openapi/v1.json {
        proxy_set_header X-User-Id "";
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    # ===== 2. RUTE PUBLIK UTAMA API (HEALTH & SCALAR REFRESH) =====
    location = /health {
        proxy_set_header X-User-Id "";
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    location ^~ /api/accounting/health {
        proxy_set_header X-User-Id "";
        rewrite ^/api/accounting/health$ /health break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    location ^~ /api/accounting/reference {
        proxy_set_header X-User-Id "";
        rewrite ^/api/accounting/reference$ /reference break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    location ^~ /api/accounting/openapi.json {
        proxy_set_header X-User-Id "";
        rewrite ^/api/accounting/openapi.json$ /openapi/v1.json break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    location ~ ^/api/(health|reference|openapi\.json|openapi)(/|$) {
        proxy_set_header X-User-Id "";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    # ===== 3. RUTE KHUSUS SUMMARY (TERLINDUNGI) =====
    location ^~ /api/summary {
        error_page 418 = @dotnet_summary_preflight;
        if ($request_method = OPTIONS) { return 418; }

        auth_request /_validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        error_page 401 = @unauthorized;

        proxy_set_header X-User-Id $auth_user_id;
        rewrite ^/api/summary$ /reports/summary break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    # ===== 4. DEFAULT FALLBACK SEMUA API LAIN TERMASUK /api/auth/me (TERLINDUNGI) =====
    location /api/ {
        error_page 418 = @dotnet_preflight;
        if ($request_method = OPTIONS) { return 418; }

        auth_request /_validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        error_page 401 = @unauthorized;

        proxy_set_header X-User-Id $auth_user_id;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    # ===== PREFLIGHT & ERROR HANDLERS =====
    location @dotnet_preflight {
        proxy_set_header X-User-Id "";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    location @dotnet_summary_preflight {
        proxy_set_header X-User-Id "";
        rewrite ^/api/summary$ /reports/summary break;
        proxy_pass http://127.0.0.1:5100;
        include /etc/nginx/nest_proxy.conf;
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"success":false,"message":"Unauthorized"}';
    }

    # ===== FRONTEND NEXT.JS (Static Export) =====
    location /_next/static/ {
        alias /usr/share/nginx/html/_next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
