name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # Diperlukan untuk commit & push otomatis kembali ke repositori

jobs:
  validate:
    runs-on: ubuntu-latest
    # PostgreSQL untuk tes integrasi (paritas jurnal dan dashboard). Tiap berkas tes
    # membuat database sementara sendiri, lalu menghapusnya.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies & Update Lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Run Autofix (Format & Lint)
        run: |
          pnpm run format || true
          pnpm run lint --fix || true

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): auto-fix lint, formatting, and update lockfile [skip ci]"
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: "."

      - name: Check Remaining Lint Errors
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

      - name: Build
        run: pnpm run build
