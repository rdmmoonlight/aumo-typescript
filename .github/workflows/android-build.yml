name: Android Build (Capacitor)

on:
  workflow_dispatch: {}

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-release:
    name: Build, Sign & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/capacitor
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web App (Vite)
        run: pnpm build

      - name: Sync Capacitor Android
        run: pnpm cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # Menghasilkan versi CalVer (yy.M.N) & VersionCode berbasis Epoch Minutes.
      - name: Generate CalVer version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          YEAR_MONTH=$(date +'%y.%-m')
          LATEST_TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || echo "")
          
          # Hapus awalan 'v' jika ada
          LATEST_VERSION="${LATEST_TAG#v}"

          if [ -n "$LATEST_VERSION" ]; then
            LATEST_YEAR_MONTH=$(echo "$LATEST_VERSION" | cut -d. -f1-2)
            LATEST_BUILD=$(echo "$LATEST_VERSION" | cut -d. -f3)
          else
            LATEST_YEAR_MONTH=""
            LATEST_BUILD="0"
          fi

          if [ "$YEAR_MONTH" = "$LATEST_YEAR_MONTH" ]; then
            NEW_BUILD=$((LATEST_BUILD + 1))
          else
            NEW_BUILD=1
          fi

          APP_VERSION="${YEAR_MONTH}.${NEW_BUILD}"
          echo "Rilis terakhir: ${LATEST_TAG:-<tidak ada>} -> versi baru: v${APP_VERSION}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

          # VersionCode selalu naik (menit sejak epoch 2026-01-01 UTC)
          EPOCH_MINUTES=$(( ( $(date -u +%s) - $(date -u -d '2026-01-01T00:00:00Z' +%s) ) / 60 ))
          echo "version_code=$EPOCH_MINUTES" >> "$GITHUB_OUTPUT"

      - name: Build release APK (unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace -PappVersionName=${{ steps.version.outputs.app_version }} -PappVersionCode=${{ steps.version.outputs.version_code }}

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > release-key.jks

      - name: Zipalign & sign APK
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          
          "$BUILD_TOOLS/zipalign" -p 4 "$UNSIGNED_APK" aligned-release.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out aumo-release-signed.apk \
            aligned-release.apk

      - name: Bersihkan file sementara & keystore
        if: always()
        run: rm -f release-key.jks aligned-release.apk

      - name: Upload APK signed (satu-satunya artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aumo-release-signed-v${{ steps.version.outputs.app_version }}
          path: capacitor/aumo-release-signed.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.app_version }}
          name: Aumo Release v${{ steps.version.outputs.app_version }}
          body: "Rilisan otomatis build ke-${{ github.run_number }}."
          files: capacitor/aumo-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}