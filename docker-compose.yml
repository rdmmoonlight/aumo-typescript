# Menjalankan image yang sama dengan Render (Dockerfile di root):
# Nginx -> Go auth (8080) + NestJS (5000), satu port publik.
#
#   docker compose up --build
#   Scalar:  http://localhost:10000/reference
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10000:10000"
    environment:
      PORT: "10000"
      # Minimal 32 karakter. Ganti sebelum dipakai di luar mesin lokal.
      JWT_SECRET: ${JWT_SECRET:-ganti-dengan-rahasia-acak-minimal-32-karakter}
      DATABASE_URL: ${DATABASE_URL:?isi DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:10000/auth/google-callback}
      # HTTP biasa di lokal: cookie Secure tidak dikirim, matikan.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
