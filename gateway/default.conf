server {
    listen 80;

    # Custom Error Handler untuk 401 Unauthorized
    error_page 401 = @unauthorized;

    location @unauthorized {
        default_type application/json;
        return 401 '{"success":false,"message":"Unauthorized"}';
    }

    # Endpoint Internal untuk Subrequest Autentikasi ke Go Auth Service
    location = /internal-auth {
        internal;
        proxy_pass http://auth-service:8080/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Service 1: Go (Auth Service)
    location /api/auth/ {
        proxy_pass http://auth-service:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Service 2: NestJS
    location /nest/ {
        proxy_pass http://nest-service:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Service 3: ASP.NET Core (Fase 4 - Protected via Gateway)
    location /dotnet/ {
        # 1. Selalu kosongkan header X-User-Id buatan client untuk cegah spoofing
        proxy_set_header X-User-Id "";

        # 2. Verifikasi autentikasi via subrequest ke Go Auth
        auth_request /internal-auth;

        # 3. Ambil X-User-Id yang dikembalikan Go Auth Service lalu kirim ke .NET
        auth_request_set $user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $user_id;

        # 4. Proxy ke ASP.NET Core (port 5100)
        proxy_pass http://dotnet-service:5100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Service 4: Rust (Mendatang)
    location /rust/ {
        proxy_pass http://rust-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}