services:
  - type: web
    name: aumo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - Dockerfile
        - nginx.conf
        - nest_proxy.conf
        - supervisord.conf
        - entrypoint.sh
        - apps/nest/**
        - apps/next/**
        - services/auth/**
        - dotnet/**
        - libs/**
        - native/workers/**
        - package.json
        - tsconfig.json
        - .dockerignore
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URL
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      # Base URL publik API (termasuk /api), dipakai membentuk URL avatar: https://<domain>/api
      - key: PUBLIC_API_URL
        sync: false